[versions]
accessmodifier = "1.35"
assertj = "3.27.7"
awaitility = "4.3.0"
commons-io = "2.22.0"
commons-text = "1.15.0"
develocity-testing-annotations = "2.0.1"
javapoet = "1.13.0"
jetbrains-annotations = "26.1.0"
junit4 = "4.13.2"
junit5 = "6.1.3"
localizer = "1.31"
maven = "3.10.0"
mockito = "5.24.0"
nebula-release = "21.1.4"
spotless = "8.11.0"

[libraries]
accessmodifier-checker = { module = "org.kohsuke:access-modifier-checker", version.ref = "accessmodifier" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-text = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }
develocity-testing-annotations = { module = "com.gradle:develocity-testing-annotations", version.ref = "develocity-testing-annotations" }
javapoet = { module = "com.squareup:javapoet", version.ref = "javapoet" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-bom = { module = "org.junit:junit-bom", version.ref = "junit5" }
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit5-launcher = { module = "org.junit.platform:junit-platform-launcher" }
localizer-maven = { module = "org.jvnet.localizer:localizer-maven-plugin", version.ref = "localizer" }
maven-model = { module = "org.apache.maven:maven-model", version.ref = "maven" }
maven-plugin-api = { module = "org.apache.maven:maven-plugin-api", version.ref = "maven" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
nebula-release-plugin = { module = "com.netflix.nebula.release:com.netflix.nebula.release.gradle.plugin", version.ref = "nebula-release" }

[plugins]
distribution-sha = { id = "com.github.sghill.distribution-sha", version = "0.4.0" }
plugin-publish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
test-logger = { id = "com.adarshr.test-logger", version = "4.0.0" }
test-retry = { id = "org.gradle.test-retry", version = "1.6.6" }