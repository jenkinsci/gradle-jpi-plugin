# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-jpi2:
    name: jpi2/${{ matrix.os }}/${{ matrix.gradle_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        gradle_version: ["8.14.3", "9.2.1"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up JDK 17
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
      with:
        java-version: "17"
        distribution: "temurin"
        cache: "gradle"
    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
    - name: Test ${{ matrix.gradle_version }}
      run: ./gradlew :jpi2:testGradle${{ matrix.gradle_version }}
    - name: Archive Test Results on Failure
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      if: ${{ failure() }}
      with:
        name: ${{ matrix.os }}-${{ matrix.gradle_version }}-test-results
        path: build/reports/tests
