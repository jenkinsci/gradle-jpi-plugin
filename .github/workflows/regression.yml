# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-jpi2:
    name: jpi2/${{ matrix.os }}/${{ matrix.gradle_version }}
    runs-on: ${{ matrix.os }}
    env:
      # Relative to the Gradle user home, so setup-gradle can cache TestKit's dependencies.
      GRADLE_TESTKIT_DIR: test-kit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        gradle_version: ["8.14.3", "9.2.1"]
    steps:
      - uses: actions/checkout@v7.0.1
      # setup-gradle below owns caching and uses a different Gradle user home on Windows.
      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            test-kit/caches
          # A restored build cache could turn outcomes that tests assert on into FROM_CACHE.
          gradle-home-cache-excludes: |
            test-kit/caches/build-cache-1
      - name: Test ${{ matrix.gradle_version }}
        run: ./gradlew :jpi2:testGradle${{ matrix.gradle_version }}
      - name: Archive Test Results on Failure
        uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() }}
        with:
          name: ${{ matrix.os }}-${{ matrix.gradle_version }}-test-results
          path: build/reports/tests
